<style id="lcars-mkii-shell-style">
/* =========================================================
   LCARS Mk II - OP CUSTOM CSS
   v0.10.93 - KISS Area Controls
   ========================================================= */

/* =========================================================
   AREA 1 - PAGE SHELL / MAIN CONTENT
   ========================================================= */

*{box-sizing:border-box}
html,body{
   margin:0;
   padding:0;
   min-height:100%;
   background:#000
}
body{
   font-family:Arial,sans-serif
}

.lcars-page{
   position:relative;
   width:100%;
   margin:0 auto;
   overflow:auto
}
.lcars-stage-shell{
   position:relative;
   margin:0 auto;
   flex:0 0 auto
}
.lcars-stage{
   position:absolute;
   left:0;
   top:0;
   transform-origin:top left;
   overflow:visible
}
.lcars-component-scene{
   z-index:1
}
.lcars-panel{
   position:absolute
}
.lcars-panel-content{
   position:relative;
   width:100%;
   height:100%;
   z-index:2
}
.lcars-component-overlay{
   position:absolute;
   z-index:3;
   pointer-events:none;
}
.lcars-number-overlay-layer{
   position:absolute;
   left:0;
   top:0;
   width:1024px;
   height:768px;
   z-index:1000;
   pointer-events:none;
}
.lcars-number-overlay{
   position:absolute;
   box-sizing:border-box;
   padding:8px;
   display:flex;
   justify-content:flex-start;
   align-items:flex-start;
   font-family:Antonio,Arial,sans-serif;
   font-size:12px;
   font-weight:500;
   line-height:1.5;
   letter-spacing:0;
   text-transform:uppercase;
   white-space:pre-wrap;
   color:#000000 !important;
   -webkit-text-fill-color:#000000 !important;
   text-shadow:none !important;
   z-index:1001;
}

.lcars-mkii-content-anchor{
   font-family:Arial,sans-serif;
   color:#f79a69;
   background:transparent
}
.lcars-mkii-content-anchor>*{
   max-width:100%
}
.lcars-text{
   font-family:"Archivo Narrow",Arial Narrow,Arial,sans-serif
}
.lcars-label{
   font-family:Antonio,Arial,sans-serif
}
.lcars-component{
   display:block;
   overflow:visible
}
.lcars-asset{
   position:absolute
}
.lcars-asset__viewport,.lcars-image-frame__body{
   position:absolute;
   inset:0;
   overflow:hidden
}
.lcars-asset__viewport img,.lcars-image-frame__image{
   position:absolute;
   inset:0;
   width:100%;
   height:100%;
   display:block
}
.lcars-asset__border{
   position:absolute;
   inset:0;
   pointer-events:none
}
.lcars-image-frame{
   position:absolute;
   overflow:visible;
   background:#000
}
.lcars-image-frame__body{
   border:var(--frame-thickness) solid var(--frame-colour);
   border-radius:var(--frame-radius);
   overflow:hidden;
   z-index:1
}
.lcars-image-frame__body .lcars-image-frame__image{
   border:var(--image-border-width) solid var(--image-border-colour);
   border-radius:max(0px,calc(var(--frame-radius) - var(--frame-thickness)));
   object-fit:contain
}
.lcars-image-frame__title{
   position:absolute;
   z-index:4;
   top:0;
   right:calc(var(--frame-thickness) + 12px);
   min-height:calc(var(--frame-thickness) * 1.8);
   padding:0 10px;background:#000;
   font-family:Antonio,Arial,sans-serif;
   font-size:max(14px,calc(var(--frame-thickness) * 1.25));
   line-height:1.05;
   text-transform:uppercase;
   display:flex;
   align-items:center;
   white-space:nowrap
}
.lcars-image-frame__base{
   position:absolute;
   z-index:3;
   left:var(--frame-thickness);
   bottom:calc(var(--frame-thickness) * -0.5);
   height:var(--frame-thickness);
   display:flex;
   gap:8px;
   align-items:stretch
}
.lcars-image-frame__base i{
   display:block;min-width:var(--frame-thickness);
   height:100%;
   font-style:normal
}
.lcars-image-frame__base i:first-child{
   width:calc(var(--frame-thickness) * 5)
}
.lcars-image-frame__base i:last-child{
   width:calc(var(--frame-thickness) * 5)
}

#lcars-mkii-op-shell-host{
   width:1360px;
   min-width:1360px;
   background:transparent;
   overflow:visible;
   position:relative;
   left:0;
   margin-left:calc((100% - 1360px)/2);
   transform:none;
   z-index:10
}
#lcars-mkii-op-shell-host .lcars-page{
   margin:0;
   overflow:visible;
   width:1360px;
   min-width:1360px
}

body.lcars-mkii-op-active{overflow-x:hidden}

html.lcars-mkii-op-active,body.lcars-mkii-op-active,body.lcars-mkii-op-active #wrapper,body.lcars-mkii-op-active #content,body.lcars-mkii-op-active #campaign-summary-row{
   background:#000
}
body.lcars-mkii-op-active #content > .campaign-landing-page-container{
   display:none
}
body.lcars-mkii-op-active #banner-container{
   position:relative;
   z-index:1
}

/* Area 1 OP compatibility */
body.lcars-mkii-op-active #lcars-mkii-area-1{
   overflow-y:auto;
   overflow-x:hidden;
   scrollbar-width:none;
   -ms-overflow-style:none
}
body.lcars-mkii-op-active #lcars-mkii-area-1::-webkit-scrollbar{
   display:none;
   width:0;
   height:0
}
body.lcars-mkii-op-active #lcars-mkii-area-1 .campaign-landing-page-container{
   width:100%;
   max-width:none;
   margin:0;
   padding:0
}
body.lcars-mkii-op-active #lcars-mkii-area-1 .wiki-page.section{
   width:100%;
   max-width:none;
   margin:0;
   padding:0
}
body.lcars-mkii-op-active #lcars-mkii-area-1 .wiki-page.section > p:first-child{
   margin:0;
   padding:0
}
body.lcars-mkii-op-active #lcars-mkii-area-1 .wiki-page.section > p:first-child img{
   display:block;
   width:100%;
   max-width:none;
   height:auto;
   margin:0;
   padding:0
}
body.lcars-mkii-op-active #lcars-mkii-area-1 .wiki-edit{
   display:none
}

/* =========================================================
   SHARED COMPONENTS - AREAS 3 AND 4
   ========================================================= */

.lcars-area-header{
   position:absolute;
   left:0;
   top:0;
   width:152px;
   height:28px;
   display:flex;
   align-items:center;
   gap:8px;
   z-index:20;
   background:#000;
   color:#ec9438;
   font:600 16px/28px Antonio,Arial,sans-serif;
   text-transform:uppercase;
   white-space:nowrap;
   overflow:hidden
}
.lcars-area-header.is-visible{opacity:1}
.lcars-area-header-cap{
   display:block;
   width:24px;
   height:16px;
   flex:0 0 24px;
   background:#ec9438;
   border-radius:16px 0 0 16px
}
.lcars-area-header-title{
   display:block;
   flex:0 0 auto;
   color:#ec9438;
   font:600 16px/28px Antonio,Arial,sans-serif;
   letter-spacing:0
}
.lcars-area-header-rail{
   display:block;
   flex:1 1 auto;
   min-width:8px;
   height:16px;
   background:#ec9438
}

/* Area 3 and Area 4 use the same visible header geometry,
   spacing and typography. */
#lcars-mkii-area-3 .lcars-personnel-identity{
   position:absolute;
   left:5px;
   top:28px;
   width:141px;
   height:62px;
   display:flex;
   gap:7px;
   align-items:center
}
#lcars-mkii-area-3 .lcars-personnel-portrait-wrap{
   width:55px;
   height:62px;
   position:relative;
   top:-1px;
   flex:0 0 55px;
   padding:0;
   border:0;
   border-radius:0;
   background:#050909;
   overflow:hidden
}
#lcars-mkii-area-3 .lcars-personnel-portrait{
   width:100%;
   height:100%;
   object-fit:contain;
   opacity:0;
   transition:opacity .5s ease
}
#lcars-mkii-area-3 .lcars-personnel-portrait.is-visible{
   opacity:1
}
#lcars-mkii-area-3 .lcars-personnel-ident-text{
   min-width:0;
   display:flex;
   flex-direction:column;
   justify-content:center;
   overflow:hidden;
   font-family:Antonio,Arial,sans-serif;text-transform:uppercase
}
#lcars-mkii-area-3 .lcars-personnel-rank{
   min-height:15px;
   font:600 10px/13px Antonio,Arial,sans-serif;
   color:#cf6769;
   white-space:nowrap
}
#lcars-mkii-area-3 .lcars-personnel-name{
   min-height:13px;
   font:600 16px/20px Antonio,Arial,sans-serif;
   color:#ec9438;
   white-space:nowrap
}
#lcars-mkii-area-3 .lcars-personnel-rule{
   position:absolute;
   left:5px;
   top:93px;
   width:141px;
   height:3px;
   background:#ec9438
}
#lcars-mkii-area-3 .lcars-personnel-content{
   position:absolute;left:5px;top:99px;width:141px;height:133px;overflow:hidden
}
#lcars-mkii-area-3 .lcars-personnel-section{
   margin:0 0 5px;overflow:visible
}
#lcars-mkii-area-3 .lcars-personnel-label{
   font:600 9px/11px Antonio,Arial,sans-serif;
   color:#cf6769;
   opacity:0;
   white-space:nowrap
}
#lcars-mkii-area-3 .lcars-personnel-label.is-visible{
   opacity:1
}
#lcars-mkii-area-3 .lcars-personnel-value,#lcars-mkii-area-3 .lcars-personnel-summary,#lcars-mkii-area-3 .lcars-personnel-posting-value{
   font:10px/12px "Archivo Narrow",Arial,sans-serif;
   color:#ec9438
}
#lcars-mkii-area-3 .lcars-personnel-summary{
   max-height:76px;
   overflow:hidden
}
#lcars-mkii-area-3 .lcars-personnel-posting-value{
   white-space:nowrap
}
#lcars-mkii-area-3 .lcars-personnel-cursor{
   display:inline-block;
   width:2px;
   height:10px;
   margin-right:3px;
   background:#ec9438;
   vertical-align:-2px;
   animation:lcars-personnel-cursor-blink .65s steps(1) infinite
}
#lcars-mkii-area-3 .lcars-personnel-rank .lcars-personnel-cursor{
   height:8px;
   background:#cf6769
}
#lcars-mkii-area-3 .lcars-personnel-name .lcars-personnel-cursor{
   height:13px
}
@keyframes lcars-personnel-cursor-blink{0%,49%{opacity:1}50%,100%{opacity:0}}

/* =========================================================
   AREA 2 - GAMEMASTER
   ========================================================= */

#lcars-mkii-area-2{
   overflow:hidden;
   width:184px;
   height:64px;
   color:#ec9438;
   background:transparent
}
#lcars-mkii-area-2 .game-master{
   width:100%;
   max-width:none;
   margin:0}
#lcars-mkii-area-2 .game-master{
   display:none
}

#lcars-mkii-area-2 .lcars-gm-card{
    position:relative;
    display:block;
    width:184px;
    height:64px;
    margin:0;
    padding:0;
    background:#050909;
    color:#ec9438;
    font-family:Antonio,Arial,sans-serif;
    overflow:hidden;
    z-index:5;
}

/* GM profile name */
#lcars-mkii-area-2 .lcars-gm-name{
    position:absolute;
    left:30px;
    top:32px;
    width:auto;
    height:auto;
    margin:0;
    padding:0;
    color:#9695c9;
    font:600 16px/18px Antonio,Arial,sans-serif;
    text-transform:uppercase;
    white-space:nowrap;
    overflow:visible;
    text-decoration:none;
    z-index:4;
}

#lcars-mkii-area-2 .lcars-gm-name:hover{
    color:#9695c9;
    text-decoration:none;
}

/* GM portrait */
#lcars-mkii-area-2 .lcars-gm-portrait{
    position:absolute;
    right:8px;
    top:8px;
    display:block;
    width:56px;
    height:48px;
    margin:0;
    padding:0;
    object-fit:contain;
    border:0;
    outline:0;
    border-radius:0;
    background:transparent;
    z-index:3;
}

/* =========================================================
   AREA 3 - PERSONNEL
   ========================================================= */

#lcars-mkii-area-3{
   overflow:hidden;
   background:transparent
}
#lcars-mkii-area-3 #lcars-mkii-personnel-container{
   position:relative;
   width:152px;
   height:240px;
   overflow:hidden;
   left:-5px;
   top:5px;
   z-index:1
}
#lcars-mkii-area-3 #lcars-mkii-personnel-record{
   position:absolute;
   inset:0;
   z-index:1;
   width:152px;
   height:240px;
   background:#050909;
   color:#ec9438;
   font-family:"Archivo Narrow",Arial,sans-serif;
   overflow:hidden
}

/* =========================================================
   AREA 4 - CAMPAIGN STREAM / ASSEMBLY CONTEXT
   ========================================================= */

#lcars-mkii-area-4 .campaign-stream-module{
   position:absolute;
   left:-10px;
   top:12px;
   width:184px;
   height:172px;
   margin:0;
   padding:0 8px;
   box-sizing:border-box;
   overflow-y:auto;
   overflow-x:hidden;
   scrollbar-width:none;
   -ms-overflow-style:none;
   background:transparent;
   border:0;
   color:#ec9438;
   font-family:"Archivo Narrow",Arial,sans-serif
}
#lcars-mkii-area-4 .campaign-stream-module::-webkit-scrollbar{
   display:none;
   width:0;
   height:0
}
#lcars-mkii-area-4 .campaign-stream-module .module-header,
#lcars-mkii-area-4 .campaign-stream-module .module-title,
#lcars-mkii-area-4 .campaign-stream-module h2,
#lcars-mkii-area-4 .campaign-stream-module h3{
   display:none
}
#lcars-mkii-area-4 .campaign-stream-module ul,
#lcars-mkii-area-4 .campaign-stream-module ol{
   margin:0;
   padding:0;
   list-style:none
}
#lcars-mkii-area-4 .campaign-stream-module li{
   margin:0 0 6px;
   padding:0;
   color:#ec9438;
   font:10px/12px "Archivo Narrow",Arial,sans-serif
}
#lcars-mkii-area-4 .campaign-stream-module a{
   color:#ec9438;
   text-decoration:none
}
#lcars-mkii-area-4 .campaign-stream-module img{
   position:relative;
   left:3px
}
#lcars-mkii-area-4 .campaign-stream-module .details{
   position:relative;
   left:10px
}

#lcars-mkii-area-4{overflow:hidden}

/* Keep the Assembly column visible. The parent panel is transparent;
   only the left content field receives the black background. */
   
.lcars-mkii-op-active .lcars-panel.panel-panel-5{
    position:relative;
    background:transparent;
}

.lcars-mkii-op-active .lcars-panel.panel-panel-5 > .lcars-panel-content{
    position:relative;
    background:transparent;
    z-index:1;
}

/* =========================================================
   AREA 5 - FAN INFORMATION / DIPLOMATIC STATUS
   ========================================================= */

/* Area 5 - EASY ADJUSTMENT CONTROLS */
#lcars-mkii-area-5{
   --area5-text-size:10pt;
   --area5-line-height:14px;
   --area5-label-left:8px;
   --area5-value-left:75px;
   --area5-row-2-top:33px;
   --area5-row-3-top:53px;
   --area5-button-left:96px;
   --area5-button-top:28px;
   --area5-button-width:80px;
   --area5-button-height:45px;
   position:relative;
   overflow:hidden;
   background:transparent
}

/* Common text */
#lcars-mkii-area-5 .lcars-area5-label,
#lcars-mkii-area-5 .lcars-area5-value{
   position:absolute;
   margin:0;
   padding:0;
   height:var(--area5-line-height);
   line-height:var(--area5-line-height);
   white-space:nowrap;
   text-decoration:none;
   font-size:var(--area5-text-size);
   letter-spacing:0;
   transform:none;
   overflow:visible
}

/* Labels */
#lcars-mkii-area-5 .lcars-area5-label{
   left:var(--area5-label-left);
   color:#d04f4f;
   font-family:Antonio,Arial,sans-serif;
   font-weight:700;
   text-align:left
}

/* Values */
#lcars-mkii-area-5 .lcars-area5-value{
   left:var(--area5-value-left);
   color:#ec9438;
   font-family:Antonio,Arial,sans-serif;
   font-weight:500
}

/* Row positions */
#lcars-mkii-area-5 .lcars-area5-environment,
#lcars-mkii-area-5 .lcars-area5-game-system{
   top:var(--area5-row-1-top)
}
#lcars-mkii-area-5 .lcars-area5-game-system{width:auto}

#lcars-mkii-area-5 .lcars-area5-population,
#lcars-mkii-area-5 .lcars-area5-fan-count{
   top:var(--area5-row-2-top)
}

#lcars-mkii-area-5 .lcars-area5-status,
#lcars-mkii-area-5 .lcars-area5-comment-count{
   top:var(--area5-row-3-top)
}

/* Fan button */
#lcars-mkii-area-5 .lcars-area5-button{
   position:absolute;
   left:var(--area5-button-left);
   top:var(--area5-button-top);
   width:var(--area5-button-width);
   height:var(--area5-button-height);
   margin:0;
   padding:0;
   border:0;
   background:transparent;
   display:block;
   cursor:pointer;
   z-index:5
}
#lcars-mkii-area-5 .lcars-area5-button img{
   display:block;
   width:80px;
   height:45px;
   margin:0;
   padding:0;
   border:0
}

/* Hidden source element */
#lcars-mkii-area-5 .lcars-area5-source{display:none}

/* Area 5 navigation/status compatibility */
.lcars-mkii-op-active .front-nav-container{
   display:none
}
.lcars-mkii-op-active #campaign-nav{
   display:none
}
.lcars-mkii-op-active .mobile-nav-top-bar{
   display:none
}
.lcars-mkii-menu-hit-layer{
   position:absolute
}
.lcars-mkii-menu-hit{
   position:absolute
}

</style>
