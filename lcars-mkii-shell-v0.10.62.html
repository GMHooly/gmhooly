<style id="lcars-mkii-shell-style">
/* =========================================================
   LCARS Mk II - OP CUSTOM CSS
   v0.10.62 - Authoritative Button Coordinate Mapping
   ========================================================= */

/* =========================================================
   AREA 1 - PAGE SHELL
   ========================================================= */

*{box-sizing:border-box}
html,body{
   margin:0;
   padding:0;
   min-height:100%;
   background:#000
}
body{
   font-family:Arial,sans-serif
}

.lcars-page{
   position:relative;
   width:100%;
   margin:0 auto;
   overflow:auto
}
.lcars-stage-shell{
   position:relative;
   margin:0 auto;
   flex:0 0 auto
}
.lcars-stage{
   position:absolute;
   left:0;
   top:0;
   transform-origin:top left;
   overflow:visible
}
.lcars-component-scene{
   z-index:1
}
.lcars-panel{
   position:absolute
}
.lcars-panel-content{
   position:relative;
   width:100%;
   height:100%;
   z-index:2
}
.lcars-component-overlay{
   position:absolute;
   z-index:3;
   pointer-events:none;
}
.lcars-number-overlay-layer{
   position:absolute;
   left:0;
   top:0;
   width:1024px;
   height:768px;
   z-index:1000;
   pointer-events:none;
}
.lcars-number-overlay{
   position:absolute;
   box-sizing:border-box;
   padding:8px;
   display:flex;
   justify-content:flex-start;
   align-items:flex-start;
   font-family:Antonio,Arial,sans-serif;
   font-size:12px;
   font-weight:500;
   line-height:1.5;
   letter-spacing:0;
   text-transform:uppercase;
   white-space:pre-wrap;
   color:#000000 !important;
   -webkit-text-fill-color:#000000 !important;
   text-shadow:none !important;
   z-index:1001;
}

.lcars-mkii-content-anchor{
   font-family:Arial,sans-serif;
   color:#f79a69;
   background:transparent
}
.lcars-mkii-content-anchor>*{
   max-width:100%
}
.lcars-text{
   font-family:"Archivo Narrow",Arial Narrow,Arial,sans-serif
}
.lcars-label{
   font-family:Antonio,Arial,sans-serif
}
.lcars-component{
   display:block;
   overflow:visible
}
.lcars-asset{
   position:absolute
}
.lcars-asset__viewport,.lcars-image-frame__body{
   position:absolute;
   inset:0;
   overflow:hidden
}
.lcars-asset__viewport img,.lcars-image-frame__image{
   position:absolute;
   inset:0;
   width:100%;
   height:100%;
   display:block
}
.lcars-asset__border{
   position:absolute;
   inset:0;
   pointer-events:none
}
.lcars-image-frame{
   position:absolute;
   overflow:visible;
   background:#000
}
.lcars-image-frame__body{
   border:var(--frame-thickness) solid var(--frame-colour);
   border-radius:var(--frame-radius);
   overflow:hidden;
   z-index:1
}
.lcars-image-frame__body .lcars-image-frame__image{
   border:var(--image-border-width) solid var(--image-border-colour);
   border-radius:max(0px,calc(var(--frame-radius) - var(--frame-thickness)));
   object-fit:contain
}
.lcars-image-frame__title{
   position:absolute;
   z-index:4;
   top:0;
   right:calc(var(--frame-thickness) + 12px);
   min-height:calc(var(--frame-thickness) * 1.8);
   padding:0 10px;background:#000;
   font-family:Antonio,Arial,sans-serif;
   font-size:max(14px,calc(var(--frame-thickness) * 1.25));
   line-height:1.05;
   text-transform:uppercase;
   display:flex;
   align-items:center;
   white-space:nowrap
}
.lcars-image-frame__base{
   position:absolute;
   z-index:3;
   left:var(--frame-thickness);
   bottom:calc(var(--frame-thickness) * -0.5);
   height:var(--frame-thickness);
   display:flex;
   gap:8px;
   align-items:stretch
}
.lcars-image-frame__base i{
   display:block;min-width:var(--frame-thickness);
   height:100%;
   font-style:normal
}
.lcars-image-frame__base i:first-child{
   width:calc(var(--frame-thickness) * 5)
}
.lcars-image-frame__base i:last-child{
   width:calc(var(--frame-thickness) * 5)
}

#lcars-mkii-op-shell-host{
   width:1360px;
   min-width:1360px;
   background:transparent;
   overflow:visible;
   position:relative;
   left:0;
   margin-left:calc((100% - 1360px)/2);
   transform:none;
   z-index:10
}
#lcars-mkii-op-shell-host .lcars-page{
   margin:0;
   overflow:visible;
   width:1360px;
   min-width:1360px
}

html.lcars-mkii-op-active,body.lcars-mkii-op-active,body.lcars-mkii-op-active #wrapper,body.lcars-mkii-op-active #content,body.lcars-mkii-op-active #campaign-summary-row{
   background:#000
}
body.lcars-mkii-op-active #content > .campaign-landing-page-container{
   display:none
}
body.lcars-mkii-op-active #banner-container{
   position:relative;
   z-index:1
}

/* =========================================================
   AREA 2 - GAMEMASTER
   ========================================================= */

#lcars-mkii-area-2{
   overflow:hidden;
   width:167px;
   height:96px;
   color:#ec9438;
   background:transparent
}
#lcars-mkii-area-2 .game-master{
   width:100%;
   max-width:none;
   margin:0}
#lcars-mkii-area-2 .game-master{
   display:none
}

#lcars-mkii-area-2 .lcars-gm-card{
    position:relative;
    display:block;
    width:167px;
    height:96px;
    margin:0;
    padding:0;
    background:#050909;
    color:#ec9438;
    font-family:Antonio,Arial,sans-serif;
    overflow:hidden;
    z-index:5;
}

/* GM profile name */
#lcars-mkii-area-2 .lcars-gm-name{
    position:absolute;
    left:25px;
    top:34px;
    width:auto;
    height:auto;
    margin:0;
    padding:0;
    color:#9695c9;
    font:600 13px/18px Antonio,Arial,sans-serif;
    text-transform:uppercase;
    white-space:nowrap;
    overflow:visible;
    text-decoration:none;
    z-index:4;
}

#lcars-mkii-area-2 .lcars-gm-name:hover{
    color:#9695c9;
    text-decoration:none;
}

/* GM portrait */
#lcars-mkii-area-2 .lcars-gm-portrait{
    position:absolute;
    right:8px;
    top:9px;
    display:block;
    width:56px;
    height:48px;
    margin:0;
    padding:0;
    object-fit:contain;
    border:0;
    outline:0;
    border-radius:0;
    background:transparent;
    z-index:3;
}

/* =========================================================
   AREA 3 - PERSONNEL
   ========================================================= */

#lcars-mkii-area-3{
   overflow:hidden;
   background:transparent
}
#lcars-mkii-area-3 #lcars-mkii-personnel-container{
   position:relative;
   width:158px;
   height:249px;
   overflow:hidden;
   left:-5px;
   top:8px;
   z-index:1
}
#lcars-mkii-area-3 #lcars-mkii-personnel-record{
   position:absolute;
   inset:0;
   z-index:1;
   width:225px;
   height:355px;background:#050909;
   color:#ec9438;
   font-family:"Archivo Narrow",Arial,sans-serif;
   overflow:hidden;
   transform:scale(.675556);
   transform-origin:top left
}
/* =========================================================
   SHARED AREA HEADER - AREAS 3 AND 4
   ========================================================= */

.lcars-area-header{
   position:absolute;
   left:0;
   top:0;
   width:152px;
   height:28px;
   display:flex;
   align-items:center;
   gap:8px;
   z-index:20;
   background:#000;
   color:#ec9438;
   font:600 16px/28px Antonio,Arial,sans-serif;
   text-transform:uppercase;
   white-space:nowrap;
   overflow:hidden
}
.lcars-area-header.is-visible{opacity:1}
.lcars-area-header-cap{
   display:block;
   width:24px;
   height:16px;
   flex:0 0 24px;
   background:#ec9438;
   border-radius:16px 0 0 16px
}
.lcars-area-header-title{
   display:block;
   flex:0 0 auto;
   color:#ec9438;
   font:600 16px/28px Antonio,Arial,sans-serif;
   letter-spacing:0
}
.lcars-area-header-rail{
   display:block;
   flex:1 1 auto;
   min-width:8px;
   height:16px;
   background:#ec9438
}

/* Area 3 and Area 4 use the same visible header geometry,
   spacing and typography. */
#lcars-mkii-area-3 .lcars-personnel-identity{
   position:absolute;
   left:8px;
   top:41px;
   width:209px;
   height:92px;
   display:flex;
   gap:10px;
   align-items:center
}
#lcars-mkii-area-3 .lcars-personnel-portrait-wrap{
   width:82px;
   height:92px;
   transform:translateY(-2px);
   flex:0 0 82px;
   padding:0;
   border:0;
   border-radius:0;
   background:#050909;
   overflow:hidden
}
#lcars-mkii-area-3 .lcars-personnel-portrait{
   width:100%;
   height:100%;
   object-fit:contain;
   opacity:0;
   transition:opacity .5s ease
}
#lcars-mkii-area-3 .lcars-personnel-portrait.is-visible{
   opacity:1
}
#lcars-mkii-area-3 .lcars-personnel-ident-text{
   min-width:0;
   display:flex;
   flex-direction:column;
   justify-content:center;
   overflow:hidden;
   font-family:Antonio,Arial,sans-serif;text-transform:uppercase
}
#lcars-mkii-area-3 .lcars-personnel-rank{
   min-height:15px;
   font:600 15px/19px Antonio,Arial,sans-serif;
   color:#cf6769;
   white-space:nowrap
}
#lcars-mkii-area-3 .lcars-personnel-name{
   min-height:29px;
   font:600 24px/29px Antonio,Arial,sans-serif;
   color:#ec9438;
   white-space:nowrap
}
#lcars-mkii-area-3 .lcars-personnel-rule{
   position:absolute;
   left:8px;
   top:138px;
   width:209px;
   height:4px;
   background:#ec9438
}
#lcars-mkii-area-3 .lcars-personnel-content{
   position:absolute;left:8px;top:147px;width:209px;height:197px;overflow:hidden
}
#lcars-mkii-area-3 .lcars-personnel-section{
   margin:0 0 7px;overflow:visible
}
#lcars-mkii-area-3 .lcars-personnel-label{
   font:600 13px/16px Antonio,Arial,sans-serif;
   color:#cf6769;
   opacity:0;
   white-space:nowrap
}
#lcars-mkii-area-3 .lcars-personnel-label.is-visible{
   opacity:1
}
#lcars-mkii-area-3 .lcars-personnel-value,#lcars-mkii-area-3 .lcars-personnel-summary,#lcars-mkii-area-3 .lcars-personnel-posting-value{
   font:15px/17px "Archivo Narrow",Arial,sans-serif;
   color:#ec9438
}
#lcars-mkii-area-3 .lcars-personnel-summary{
   max-height:112px;
   overflow:hidden
}
#lcars-mkii-area-3 .lcars-personnel-posting-value{
   white-space:nowrap
}
#lcars-mkii-area-3 .lcars-personnel-cursor{
   display:inline-block;
   width:3px;
   height:15px;
   margin-right:4px;
   background:#ec9438;
   vertical-align:-2px;
   animation:lcars-personnel-cursor-blink .65s steps(1) infinite
}
#lcars-mkii-area-3 .lcars-personnel-rank .lcars-personnel-cursor{
   height:11px;
   background:#cf6769
}
#lcars-mkii-area-3 .lcars-personnel-name .lcars-personnel-cursor{
   height:20px
}
@keyframes lcars-personnel-cursor-blink{0%,49%{opacity:1}50%,100%{opacity:0}}

/* =========================================================
   AREA 4 - OP CAMPAIGN STREAM
   ========================================================= */
#lcars-mkii-area-4 .campaign-stream-module{
   position:absolute;
   left:0;
   top:28px;
   width:152px;
   height:156px;
   margin:0;
   padding:0;
   overflow:hidden;
   background:transparent;
   border:0;
   color:#ec9438;
   font-family:"Archivo Narrow",Arial,sans-serif
}
#lcars-mkii-area-4 .campaign-stream-module .module-header,
#lcars-mkii-area-4 .campaign-stream-module .module-title,
#lcars-mkii-area-4 .campaign-stream-module h2,
#lcars-mkii-area-4 .campaign-stream-module h3{
   display:none
}
#lcars-mkii-area-4 .campaign-stream-module ul,
#lcars-mkii-area-4 .campaign-stream-module ol{
   margin:0;
   padding:0;
   list-style:none
}
#lcars-mkii-area-4 .campaign-stream-module li{
   margin:0 0 6px;
   padding:0;
   color:#ec9438;
   font:10px/12px "Archivo Narrow",Arial,sans-serif
}
#lcars-mkii-area-4 .campaign-stream-module a{
   color:#ec9438;
   text-decoration:none
}

/* =========================================================
   AREA 5 - OP FAN INFORMATION / DIPLOMATIC STATUS
   ========================================================= */
#lcars-mkii-area-5{
   overflow:hidden;
   background:transparent
}
#lcars-mkii-area-5 .lcars-op-fan-module{
   position:absolute;
   left:0;
   top:24px;
   width:152px;
   height:63px;
   margin:0;
   padding:0 8px;
   box-sizing:border-box;
   overflow:hidden;
   background:transparent;
   color:#ec9438;
   font-family:"Archivo Narrow",Arial,sans-serif
}
#lcars-mkii-area-5 .lcars-op-fan-module .module-header,
#lcars-mkii-area-5 .lcars-op-fan-module .module-title,
#lcars-mkii-area-5 .lcars-op-fan-module h2,
#lcars-mkii-area-5 .lcars-op-fan-module h3{
   display:none
}
#lcars-mkii-area-5 .lcars-op-fan-module a,
#lcars-mkii-area-5 .lcars-op-fan-module span,
#lcars-mkii-area-5 .lcars-op-fan-module p,
#lcars-mkii-area-5 .lcars-op-fan-module li{
   color:#ec9438;
   font-family:"Archivo Narrow",Arial,sans-serif
}

/* =========================================================
   AREA 4 - ASSEMBLY / CONTEXT
   ========================================================= */

#lcars-mkii-area-4{overflow:hidden}

/* Keep the Assembly column visible. The parent panel is transparent;
   only the left content field receives the black background. */
   
.lcars-mkii-op-active .lcars-panel.panel-panel-5{
    position:relative;
    background:transparent;
}

.lcars-mkii-op-active .lcars-panel.panel-panel-5 > .lcars-panel-content{
    position:relative;
    background:transparent;
    z-index:1;
}

/* =========================================================
   AREA 5 - NAVIGATION / STATUS
   ========================================================= */

.lcars-mkii-op-active .front-nav-container{
   display:none
}
.lcars-mkii-op-active #campaign-nav{
   display:none
}
.lcars-mkii-op-active .mobile-nav-top-bar{
   display:none
}

.lcars-mkii-menu-hit-layer{
   position:absolute
}
.lcars-mkii-menu-hit{
   position:absolute
}

/* =========================================================
   OP COMPATIBILITY - AREA-SPECIFIC BEHAVIOUR
   ========================================================= */

body.lcars-mkii-op-active #lcars-mkii-area-1{
   overflow-y:auto;
   overflow-x:hidden;
   scrollbar-width:none;
   -ms-overflow-style:none
}
body.lcars-mkii-op-active #lcars-mkii-area-1::-webkit-scrollbar{
   display:none;
   width:0;
   height:0
}
body.lcars-mkii-op-active #lcars-mkii-area-1 .campaign-landing-page-container{
   width:100%;
   max-width:none;
   margin:0;
   padding:0
}
body.lcars-mkii-op-active #lcars-mkii-area-1 .wiki-page.section{
   width:100%;
   max-width:none;
   margin:0;
   padding:0
}
body.lcars-mkii-op-active #lcars-mkii-area-1 .wiki-page.section > p:first-child{
   margin:0;
   padding:0
}
body.lcars-mkii-op-active #lcars-mkii-area-1 .wiki-page.section > p:first-child img{
   display:block;
   width:100%;
   max-width:none;
   height:auto;
   margin:0;
   padding:0
}
body.lcars-mkii-op-active #lcars-mkii-area-1 .wiki-edit{
   display:none
}

</style>
